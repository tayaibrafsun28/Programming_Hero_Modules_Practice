<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .full-width {
            grid-column: span 6;
            grid-row: span 2;

        }

        .chipa{
            grid-row: span 1;
            grid-column: span 2;
        }

        .medium{
            grid-column: span 2;
            grid-row: span 2;
        }

        .small{
            grid-column: span 1;
            grid-row: span 1;
        }

        img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="img full-width"><img src="./images/A.jpg" alt=""></div>
        <div class="img medium"><img src="./images/B.jpg" alt=""></div>
        <div class="img medium"><img src="./images/C.jpg" alt=""></div>
        <div class="img chipa"><img src="./images/D.jpg" alt=""></div>
        <div class="img chipa"><img src="./images/E.jpg" alt=""></div>
        <div class="img medium"><img src="./images/F.jpg" alt=""></div>
        <div class="img small"><img src="./images/G.jpg" alt=""></div>
          <div class="img small"><img src="./images/G.jpg" alt=""></div>
      
        <div class="img medium"><img src="./images/I.jpg" alt=""></div>
          <div class="img small"><img src="./images/G.jpg" alt=""></div>
        <div class="img small"><img src="./images/G.jpg" alt=""></div>
        
    </div>
</body>

</html>
