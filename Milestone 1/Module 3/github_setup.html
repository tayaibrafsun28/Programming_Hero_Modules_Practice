<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <ol>
        <li>
            <h2>Initialization</h2>
            <h4>git init</h4>
        </li>

        <li>
            <h2>Add files and folders</h2>
            <h4>git add .</h4>
        </li>

        <li>
            <h2>Commit</h2>
            <h4>git commit -m "commit_message"</h4>
        </li>

        <li>
            <h2>Select Branch</h2>
            <h4>git branch -M main</h4>
        </li>

        <li>
            <h2>Assign remote address</h2>
            <h4>git remote add origin url.git</h4>
        </li>

        <li>
            <h2>Push Code to Origin</h2>
            <h4>git push -u origin main</h4>
        </li>
    </ol>

</body>

</html>
