<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Onclick Event Via Script Tag</h1>
    <button onclick="makeRed()">Make Page red</button>
    <button id="make-blue">Make Page Blue</button>

    <script>
        function makeRed() {
            document.body.style.background = 'red';
        }
    </script>

</body>
